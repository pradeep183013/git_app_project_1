<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>Developing Login Form Funtionality</h1>
    </div>
    <div>
        <form>
            <div>
                <input type="text" name="mobile" placeholder="Enter Mobile Number">
            </div>
            <div>
                <button>Send OTP</button>
            </div>
        </form>
    </div>
    <script>
        const input = document.querySelector("input");
        const form = document.querySelector("form");

        let parsedNum = '';

        function validateMobileNumber(number){

            if(number.trim().length > 10){
                input.value = parsedNum;
                return;
            }

            let result = parseInt(number)

            if(isNaN(result)){
                input.value = '';
                parsedNum = '';
                return '';
            }

            parsedNum = result.toString();

            input.value = parsedNum;

        }

        input.addEventListener("keyup",(e)=>{
            validateMobileNumber(e.target.value)
        });

        form.addEventListener("submit",(e)=>{
            e.preventDefault();

            console.log({mobile : parsedNum, length : parsedNum.length})

            const message = parsedNum.length === 10 ? `Valid Mobile Number` : `Invalid Number. Found ${parsedNum.length}/10.`

            alert(message)

            parsedNum = '';

        })
    </script>
</body>
</html>
